<!--
================================================================================
  このアプリについて
  大会トーナメント表 — 設計思想と共同編集の進め方
================================================================================

【アプリの目的】
  「大石道場杯」のような単発の大会（8人・勝ち抜き方式）の対戦表を、
  仲間内でリアルタイムに共有しながら記録・閲覧するためのアプリ。
  紙のトーナメント表（1回戦→準決勝→決勝、3位決定戦、5位・7位決定戦）を
  デジタルで再現する。

【対戦形式（固定・8人）】
  本戦：1回戦(4試合) → 準決勝(2試合) → 決勝 → 優勝・準優勝
        準決勝の敗者2名 → 3位決定戦 → 3位・4位
  下位：1回戦の敗者4名 → 下位準決勝(2試合)
        下位準決勝の勝者2名 → 5位決定戦 → 5位・6位
        下位準決勝の敗者2名 → 7位決定戦 → 7位・8位

  対局者名の入力は、⚙️設定タブでまとめて入力する方法と、
  🖼トーナメント表の本戦の枠を直接タップして1人ずつ入力・修正する
  方法の両方に対応する。

  結果の入力は「ラウンドごとのカードリスト」形式（対局者名をタップして
  勝者を選択）で行い、その内容をもとに紙のトーナメント表のような
  罫線でつないだブラケット図（本戦・3位決定戦・5位決定戦・7位決定戦）を
  自動で描画する。罫線は常にグレーで骨組みを描き、実際に勝ち上がった
  経路だけを赤で上書きする（負けた側の線は最後までグレーのまま）ため、
  誰が勝ったかが一目でわかる。
  上位ラウンドの結果を変更した場合、その結果に依存する下流の試合結果は
  自動的にクリアされる。

【利用環境】
  - スマホ利用を最優先とする（モバイルファースト）
  - GitHub Pages でホスティング（単一 tournament.html で完結）
  - Firebase Realtime Database によるリアルタイム同期

【セキュリティ】
  - 合言葉認証あり（他アプリと共通の合言葉）
  - 認証情報はブラウザのlocalStorageに保存される

【技術構成】
  - バニラJS（React・Babel 不使用）
  - Firebase Realtime Database（igo.html/mahjong.htmlと同じプロジェクトを使用）
  - 外部ライブラリなし・ビルド不要・1ファイル完結
  - 新しい技術より、継続して利用しやすい構成を優先する

【共同編集の進め方】
  このアプリは、ユーザーと生成AIが対話しながら少しずつ育てていくものです。
  以下は、その共同作業をうまく続けるための共通認識です。

  ・このアプリの文脈と歴史を理解した上で提案する
  ・変更の意図と影響範囲を共有しながら進める
  ・小さな積み重ねを大切にし、一度に大きく変えない
  ・既存の操作感や雰囲気はできるだけ引き継ぐ
  ・読みやすく・触りやすく・壊れにくい構成を選ぶ
  ・新しい技術より、長く使い続けられることを優先する
  ・機能を追加・変更したら「主な機能」と「今後の改良候補」を合わせて更新する

【主な機能（現時点）】
  - 大会名・対局者8名の設定（⚙️設定タブでまとめて入力／トーナメント図の
    本戦の枠を直接タップして1人ずつ入力・修正、の両方に対応）
  - 結果入力（ラウンドごとのカード表示。対局者名タップで勝者選択）
  - トーナメント図（罫線でつないだブラケット表示。本戦・3位決定戦・
    5位決定戦・7位決定戦。勝ち上がった経路だけ赤で表示され、負けた側は
    グレーのまま残るので、誰が勝ったかが一目でわかる）
  - 3位決定戦・5位決定戦・7位決定戦の自動組み合わせ
  - 結果だけリセット（対局者名は保持）
  - 新しい大会にする（現在の大会をアーカイブして白紙に戻す）
  - 過去の大会アーカイブ表示
  - Firebase によるリアルタイム同期

【今後の改良候補】
  - 人数を可変にする（4人・16人など）
  - 不戦勝（空き枠）対応
  - 対局日・対局場所などのメモ欄
================================================================================
-->

<script>
const firebaseConfig = {
  apiKey:            "AIzaSyBSrQkPMPc-icuph244VBorNqRf2yP-U7Y",
  authDomain:        "hiking-558a9.firebaseapp.com",
  databaseURL:       "https://hiking-558a9-default-rtdb.firebaseio.com",
  projectId:         "hiking-558a9",

  messagingSenderId: "1066293850319",
  appId:             "1:1066293850319:web:94409f01b194d5afe7c7ba"
};

function emptyResults() {
  return { qf:[null,null,null,null], sf:[null,null], final:null, third:null, cLower:[null,null], fifth:null, seventh:null };
}

let state = { title:"", players:["","","","","","","",""], results: emptyResults() };
let stateRef = null, archiveRef = null;
const isConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";
let editingSetup = false;

if (isConfigured) {
  try {
    firebase.initializeApp(firebaseConfig);
    stateRef   = firebase.database().ref("tournament/state");
    archiveRef = firebase.database().ref("tournament/archive");
    stateRef.on("value", snap => {
      const data = snap.val();
      if (data) {
        state = {
          title:   typeof data.title === "string" ? data.title : "",
          players: Array.isArray(data.players) && data.players.length === 8 ? data.players : state.players,
          results: data.results ? { ...emptyResults(), ...data.results } : emptyResults()
        };
        if (!editingSetup) fillSettingsInputs();
        renderAll();
      }
      setSyncStatus(true);
    }, () => setSyncStatus(false));
    renderArchive();
  } catch(e) {
    console.error("Firebase init failed:", e);
    setSyncStatus(false);
  }
} else {
  document.getElementById("setup-banner").style.display = "block";
  setSyncStatus(false);
  fillSettingsInputs();
  renderAll();
}

function pushState() { if (stateRef) stateRef.set(state); renderAll(); }

function setSyncStatus(online) {
  const dot = document.getElementById("sync-dot");
  const lbl = document.getElementById("sync-label");
  if (!isConfigured) { dot.style.background = "#e67e22"; lbl.textContent = "ローカルモード（Firebase未設定）"; return; }
  if (online) {
    dot.style.background = "#2ecc71";
    const now = new Date();
    lbl.textContent = `リアルタイム同期中 · ${now.getHours()}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  } else { dot.style.background = "#e74c3c"; lbl.textContent = "オフライン"; }
}
function pad(n) { return String(n).padStart(2, "0"); }

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
  });
});

function escapeHtml(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ---------- 組み合わせロジック ----------
function pairResult(players, resultVal) {
  const [a, b] = players;
  if (resultVal === null || resultVal === undefined || !a || !b) return { winner:null, loser:null };
  return resultVal === 0 ? { winner:a, loser:b } : { winner:b, loser:a };
}
function getQFPlayers(i) { return [state.players[2*i] || null, state.players[2*i+1] || null]; }
function getQFResult(i)  { return pairResult(getQFPlayers(i), state.results.qf[i]); }

function getSFPlayers(i) { return [getQFResult(2*i).winner, getQFResult(2*i+1).winner]; }
function getSFResult(i)  { return pairResult(getSFPlayers(i), state.results.sf[i]); }

function getFinalPlayers() { return [getSFResult(0).winner, getSFResult(1).winner]; }
function getFinalResult()  { return pairResult(getFinalPlayers(), state.results.final); }

function getThirdPlayers() { return [getSFResult(0).loser, getSFResult(1).loser]; }
function getThirdResult()  { return pairResult(getThirdPlayers(), state.results.third); }

function getCLowerPlayers(i) { return [getQFResult(2*i).loser, getQFResult(2*i+1).loser]; }
function getCLowerResult(i)  { return pairResult(getCLowerPlayers(i), state.results.cLower[i]); }

function getFifthPlayers() { return [getCLowerResult(0).winner, getCLowerResult(1).winner]; }
function getFifthResult()  { return pairResult(getFifthPlayers(), state.results.fifth); }

function getSeventhPlayers() { return [getCLowerResult(0).loser, getCLowerResult(1).loser]; }
function getSeventhResult()  { return pairResult(getSeventhPlayers(), state.results.seventh); }

function setWinner(cat, idx, side) {
  if (cat === "qf") {
    state.results.qf[idx] = side;
    const sfIdx = Math.floor(idx/2);
    state.results.sf[sfIdx] = null;
    state.results.final = null;
    state.results.third = null;
    state.results.cLower[sfIdx] = null;
    state.results.fifth = null;
    state.results.seventh = null;
  } else if (cat === "sf") {
    state.results.sf[idx] = side;
    state.results.final = null;
    state.results.third = null;
  } else if (cat === "cLower") {
    state.results.cLower[idx] = side;
    state.results.fifth = null;
    state.results.seventh = null;
  } else if (cat === "final") {
    state.results.final = side;
  } else if (cat === "third") {
    state.results.third = side;
  } else if (cat === "fifth") {
    state.results.fifth = side;
  } else if (cat === "seventh") {
    state.results.seventh = side;
  }
  pushState();
}

// ---------- トーナメント図（ブラケット線） ----------
// leaves: 末端の対局者名の配列（長さは2のべき乗）
// winnerSideLevels: ラウンドごとの勝者サイド配列（winnerSideLevels[r][i] は 0/1/null。
//   0=そのカードの上側が勝ち、1=下側が勝ち、null=未定）
// winnerName/loserName: 最終的な勝者・敗者名（未定ならnull）
// outputLabels: [勝者側の見出し, 敗者側の見出し]（例：["優勝","準優勝"]）
//
// 罫線は常にグレーで骨組みを描き、実際に勝ち上がった経路だけ赤で上書きする。
// 負けた側の線は最後まで（最終順位ボックスへの線も含めて）グレーのまま。
// editable: true の場合、葉ボックス（対局者名）をタップして直接編集できる
//   （本戦の1回戦＝対局者8名の入力に使う。3位/5位/7位決定戦の図は結果から自動計算される
//   ため編集不可＝falseのまま呼び出す）
function renderBracketDiagram(container, leaves, winnerSideLevels, winnerName, loserName, outputLabels, editable) {
  const n = leaves.length;
  const rounds = Math.log2(n);
  const rowH = 46, leafW = 120, boxH = 34, stepW = 30, outBoxW = 120, gapOut = boxH + 12;
  const GRAY = "#d8d2c2", RED = "#b03a2e";

  // 各段の中心y座標を計算（levels[0]=葉、levels[rounds]=最終合流点）
  const levels = [Array.from({ length:n }, (_, i) => (i + 0.5) * rowH)];
  while (levels[levels.length - 1].length > 1) {
    const prev = levels[levels.length - 1];
    const next = [];
    for (let i = 0; i < prev.length; i += 2) next.push((prev[i] + prev[i+1]) / 2);
    levels.push(next);
  }

  const finalY = levels[rounds][0];
  const outTopY = finalY - gapOut / 2, outBotY = finalY + gapOut / 2;
  const xAfterRounds = leafW + rounds * stepW;
  const totalW = xAfterRounds + stepW + outBoxW + 4;
  const totalH = n * rowH;

  const seg = (x1,y1,x2,y2,color,w) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}"/>`;

  let baseLines = "", winLines = "", boxes = "";

  leaves.forEach((name, i) => {
    const y = levels[0][i] - boxH / 2;
    const cls = "bd-box" + (editable ? " bd-editable" : "");
    const attr = editable ? ` data-leaf-idx="${i}"` : "";
    const label = name ? escapeHtml(name) : (editable ? `<span class="bd-placeholder">対局者${i+1}</span>` : "―");
    boxes += `<div class="${cls}" style="left:0px; top:${y}px; width:${leafW}px; height:${boxH}px; line-height:${boxH}px"${attr}>${label}</div>`;
  });

  for (let r = 0; r < rounds; r++) {
    const fromYs = levels[r], toYs = levels[r+1];
    const xIn = leafW + r * stepW, xMid = xIn + stepW / 2, xOut = leafW + (r+1) * stepW;
    for (let i = 0; i < toYs.length; i++) {
      const yTop = fromYs[2*i], yBot = fromYs[2*i+1], yMid = toYs[i];
      // 骨組み（常にグレー）
      baseLines += seg(xIn,yTop,xMid,yTop,GRAY,1.5) + seg(xIn,yBot,xMid,yBot,GRAY,1.5)
                 + seg(xMid,yTop,xMid,yBot,GRAY,1.5) + seg(xMid,yMid,xOut,yMid,GRAY,1.5);
      // 勝者側だけ赤で上書き
      const side = winnerSideLevels[r] ? winnerSideLevels[r][i] : null;
      if (side === 0 || side === 1) {
        const yWin = side === 0 ? yTop : yBot;
        winLines += seg(xIn,yWin,xMid,yWin,RED,2.5) + seg(xMid,yWin,xMid,yMid,RED,2.5) + seg(xMid,yMid,xOut,yMid,RED,2.5);
      }
    }
  }

  // 最終合流点 → 勝者・敗者の出力ボックスへの分岐（敗者側の線はグレーのまま）
  {
    const xIn = xAfterRounds, xMid = xIn + stepW / 2, xOut = xIn + stepW;
    baseLines += seg(xIn,finalY,xMid,finalY,GRAY,1.5)
               + seg(xMid,outTopY,xMid,outBotY,GRAY,1.5)
               + seg(xMid,outTopY,xOut,outTopY,GRAY,1.5)
               + seg(xMid,outBotY,xOut,outBotY,GRAY,1.5);
    const decided = !!(winnerSideLevels[rounds-1] && (winnerSideLevels[rounds-1][0] === 0 || winnerSideLevels[rounds-1][0] === 1));
    if (decided) {
      winLines += seg(xIn,finalY,xMid,finalY,RED,2.5) + seg(xMid,finalY,xMid,outTopY,RED,2.5) + seg(xMid,outTopY,xOut,outTopY,RED,2.5);
    }
  }

  boxes += `<div class="bd-box bd-out ${winnerName ? "bd-decided" : ""}" style="left:${xAfterRounds+stepW}px; top:${outTopY-boxH/2}px; width:${outBoxW}px; height:${boxH}px">
    <span class="bd-out-label">${outputLabels[0]}</span>${winnerName ? escapeHtml(winnerName) : ""}
  </div>`;
  boxes += `<div class="bd-box bd-out ${loserName ? "bd-decided" : ""}" style="left:${xAfterRounds+stepW}px; top:${outBotY-boxH/2}px; width:${outBoxW}px; height:${boxH}px">
    <span class="bd-out-label">${outputLabels[1]}</span>${loserName ? escapeHtml(loserName) : ""}
  </div>`;

  container.innerHTML = `<div class="bd-scroll"><div class="bd-wrap" style="width:${totalW}px; height:${totalH}px">
    <svg width="${totalW}" height="${totalH}" style="position:absolute;top:0;left:0">${baseLines}${winLines}</svg>
    ${boxes}
  </div></div>`;

  if (editable) {
    container.querySelectorAll(".bd-editable").forEach(box => {
      box.addEventListener("click", () => editLeafName(Number(box.dataset.leafIdx)));
    });
  }
}

// トーナメント図の葉ボックスをタップして対局者名を直接編集する
function editLeafName(idx) {
  const current = state.players[idx] || "";
  const input = prompt(`対局者${idx+1}の名前を入力してください`, current);
  if (input === null) return; // キャンセル
  state.players[idx] = input.trim();
  pushState();
}

// ---------- 描画 ----------
function matchCardHTML(label, cat, idx, players, resultVal) {
  const [a, b] = players;
  const clickable = !!a && !!b;
  const aSel = resultVal === 0, bSel = resultVal === 1;
  return `<div class="match-card">
    <div class="match-label">${label}</div>
    <div class="match-row">
      <button class="player-btn ${aSel?'winner':''} ${!clickable?'disabled':''}" data-cat="${cat}" data-idx="${idx}" data-side="0" ${clickable?'':'disabled'}>${a ? escapeHtml(a) : "（未定）"}</button>
      <span class="vs">vs</span>
      <button class="player-btn ${bSel?'winner':''} ${!clickable?'disabled':''}" data-cat="${cat}" data-idx="${idx}" data-side="1" ${clickable?'':'disabled'}>${b ? escapeHtml(b) : "（未定）"}</button>
    </div>
  </div>`;
}

function renderBracket() {
  const el = document.getElementById("panel-bracket");

  let html = "";
  if (state.title) html += `<h3 style="margin-bottom:16px">${escapeHtml(state.title)}</h3>`;

  // ===== トーナメント図 =====
  html += `<h4 class="section-head">🖼 トーナメント表</h4>`;
  html += `<p class="note" style="margin-top:-2px">本戦の対局者名は、下の枠を直接タップして入力・修正できます。</p>`;
  html += `<div class="bracket-block"><div class="bracket-block-title">本戦</div><div id="bd-main"></div></div>`;
  html += `<div class="bracket-block"><div class="bracket-block-title">3位決定戦</div><div id="bd-third"></div></div>`;
  html += `<div class="bracket-divider"></div>`;
  html += `<div class="bracket-block"><div class="bracket-block-title">5位決定戦</div><div id="bd-fifth"></div></div>`;
  html += `<div class="bracket-block"><div class="bracket-block-title">7位決定戦</div><div id="bd-seventh"></div></div>`;

  // ===== 結果入力（タップで勝者選択） =====
  html += `<h4 class="section-head">📝結果を入力</h4>`;

  html += `<div class="match-label" style="margin:0 0 6px">1回戦</div>`;
  for (let i=0;i<4;i++) html += matchCardHTML(`第${i+1}試合`, "qf", i, getQFPlayers(i), state.results.qf[i]);

  html += `<div class="match-label" style="margin:14px 0 6px">2回戦（準決勝）</div>`;
  for (let i=0;i<2;i++) html += matchCardHTML(`準決勝${i+1}`, "sf", i, getSFPlayers(i), state.results.sf[i]);

  html += `<div class="match-label" style="margin:14px 0 6px">決勝</div>`;
  html += matchCardHTML("優勝・準優勝", "final", 0, getFinalPlayers(), state.results.final);

  html += `<div class="match-label" style="margin:14px 0 6px">3位決定戦</div>`;
  html += matchCardHTML("準決勝の敗者同士", "third", 0, getThirdPlayers(), state.results.third);

  html += `<div class="match-label" style="margin:14px 0 6px">下位トーナメント（1回戦の敗者）</div>`;
  for (let i=0;i<2;i++) html += matchCardHTML(`下位準決勝${i+1}`, "cLower", i, getCLowerPlayers(i), state.results.cLower[i]);

  html += `<div class="match-label" style="margin:14px 0 6px">5位決定戦</div>`;
  html += matchCardHTML("下位準決勝の勝者同士", "fifth", 0, getFifthPlayers(), state.results.fifth);

  html += `<div class="match-label" style="margin:14px 0 6px">7位決定戦</div>`;
  html += matchCardHTML("下位準決勝の敗者同士", "seventh", 0, getSeventhPlayers(), state.results.seventh);

  el.innerHTML = html;
  el.querySelectorAll(".player-btn:not([disabled])").forEach(btn => {
    btn.addEventListener("click", () => setWinner(btn.dataset.cat, Number(btn.dataset.idx), Number(btn.dataset.side)));
  });

  // 図を描画
  renderBracketDiagram(
    document.getElementById("bd-main"),
    state.players,
    [ state.results.qf, state.results.sf, [state.results.final] ],
    getFinalResult().winner, getFinalResult().loser, ["優勝", "準優勝"],
    true
  );
  renderBracketDiagram(
    document.getElementById("bd-third"),
    getThirdPlayers(),
    [ [state.results.third] ],
    getThirdResult().winner, getThirdResult().loser, ["第3位", "第4位"]
  );
  renderBracketDiagram(
    document.getElementById("bd-fifth"),
    [getQFResult(0).loser, getQFResult(1).loser, getQFResult(2).loser, getQFResult(3).loser],
    [ state.results.cLower, [state.results.fifth] ],
    getFifthResult().winner, getFifthResult().loser, ["第5位", "第6位"]
  );
  renderBracketDiagram(
    document.getElementById("bd-seventh"),
    getSeventhPlayers(),
    [ [state.results.seventh] ],
    getSeventhResult().winner, getSeventhResult().loser, ["第7位", "第8位"]
  );
}

function renderAll() { renderBracket(); }

// ---------- 設定タブ ----------
function fillSettingsInputs() {
  document.getElementById("t-title").value = state.title || "";
  state.players.forEach((name, i) => { document.getElementById("t-p"+i).value = name || ""; });
}

["t-title", ...[0,1,2,3,4,5,6,7].map(i=>"t-p"+i)].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener("focus", () => editingSetup = true);
  el.addEventListener("blur",  () => editingSetup = false);
});

document.getElementById("save-setup").addEventListener("click", () => {
  state.title = document.getElementById("t-title").value.trim();
  state.players = [0,1,2,3,4,5,6,7].map(i => document.getElementById("t-p"+i).value.trim());
  pushState();
  showToast("設定を保存し、全員に同期しました！");
});

document.getElementById("admin-toggle").addEventListener("click", () => {
  const body = document.getElementById("admin-body");
  const arrow = document.getElementById("admin-arrow");
  const isOpen = body.style.display !== "none";
  body.style.display = isOpen ? "none" : "";
  arrow.textContent = isOpen ? "▶" : "▼";
});

document.getElementById("reset-results").addEventListener("click", () => {
  if (!confirm("対局結果をすべて消去します。対局者名はそのまま残ります。よろしいですか？")) return;
  state.results = emptyResults();
  pushState();
  showToast("結果をリセットしました");
});

document.getElementById("new-tournament").addEventListener("click", () => {
  if (!confirm("現在の大会をアーカイブし、新しい大会を始めます。よろしいですか？")) return;
  if (archiveRef) {
    const now = new Date();
    const dateStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;
    archiveRef.push({ title: state.title, players: state.players, results: state.results, endDate: dateStr });
  }
  state = { title:"", players:["","","","","","","",""], results: emptyResults() };
  pushState();
  fillSettingsInputs();
  showToast("新しい大会を開始しました");
  renderArchive();
});

function renderArchive() {
  const el = document.getElementById("archive-list");
  if (!el || !archiveRef) return;
  archiveRef.once("value", snap => {
    const data = snap.val();
    if (!data) { el.innerHTML = `<p class="note" style="margin:0">まだアーカイブされた大会はありません。</p>`; return; }
    const list = Object.values(data).reverse();
    el.innerHTML = list.map(t => {
      const champion = t.results && t.results.final !== null && t.results.final !== undefined
        ? (t.results.final === 0 ? "" : "") : "";
      return `<div class="archive-card">
        <strong>${escapeHtml(t.title || "（無題の大会）")}</strong>（${t.endDate || ""}）<br>
        <span style="color:#666">対局者：${(t.players||[]).filter(p=>p).join("・")}</span>
      </div>`;
    }).join("");
  });
}

// ---------- トースト ----------
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.display = "block";
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.display = "none", 2500);
}

fillSettingsInputs();
renderAll();
</script>
</body>
</html>
