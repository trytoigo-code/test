<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>囲碁AI v1.3</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f5f1e8;color:#222;margin:0;padding:16px}
main{max-width:920px;margin:auto}.card{background:white;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 5px #0001}
button{font:inherit;border:0;border-radius:10px;padding:9px 12px;background:#222;color:white}.secondary{background:#e8e4dc;color:#222}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{background:#eee;border-radius:99px;padding:3px 7px;font-size:12px}
#board{display:grid;grid-template-columns:repeat(19,1fr);width:min(92vw,570px);aspect-ratio:1;margin:12px auto;background:#d7a85c;border:8px solid #6b431f}
.pt{position:relative;padding:0;border-radius:0;background:transparent}.pt:before{content:"";position:absolute;left:5%;right:5%;top:50%;height:1px;background:#333}.pt:after{content:"";position:absolute;top:5%;bottom:5%;left:50%;width:1px;background:#333}
.stone{position:relative;z-index:2;display:block;width:78%;height:78%;margin:11%;border-radius:50%;box-shadow:0 1px 3px #0007}.black{background:#111}.white{background:#f7f7f7;border:1px solid #777;box-sizing:border-box}
textarea{width:100%;min-height:120px;box-sizing:border-box;font-family:ui-monospace,monospace}pre{white-space:pre-wrap;background:#f3f3f3;padding:10px;border-radius:8px;overflow:auto}
</style>
</head>
<body><main>
<h1>囲碁AI — 好みに合う強い手</h1>
<p>v1.3 / 局面と着手履歴を一体で保存する版</p>
<div class="card">
<div class="row"><button id="analyzeBtn">KataGo問い合わせを作る</button><button class="secondary" id="saveBtn">現在局面を保存</button><button class="secondary" id="resetBtn">リセット</button></div>
<p id="status"></p>
</div>
<div id="board"></div>
<div class="card"><h3>現在のゲーム</h3><div id="gameInfo"></div></div>
<div class="card"><h3>生成したKataGo問い合わせ</h3><pre id="query">まだありません。</pre></div>
<div class="card"><h3>保存した判断局面</h3><div id="history">まだありません。</div></div>
</main>
<script type="module" src="./app.js"></script>
</body></html>
